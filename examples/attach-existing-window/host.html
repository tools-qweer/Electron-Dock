<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'"
    >
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Electron Dock attachWorkspace example</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", sans-serif;
        color: #e8efed;
        background: #0f1212;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #0f1212;
      }

      header {
        height: 56px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 20px;
        border-bottom: 1px solid #303636;
        background: #171b1a;
      }

      header strong {
        color: #00e3bd;
      }

      aside {
        position: fixed;
        inset: 56px auto 0 0;
        width: 220px;
        padding: 24px 18px;
        border-right: 1px solid #303636;
        color: #a9b5b2;
        background: #121615;
      }

      aside h2 {
        margin: 0 0 14px;
        color: #f2f6f5;
        font-size: 16px;
      }

      aside p {
        margin: 0 0 12px;
        font-size: 13px;
        line-height: 1.55;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>Consumer-owned BrowserWindow</strong>
      <span>The Dock workspace is attached below.</span>
    </header>
    <aside>
      <h2>Host content</h2>
      <p>This header and sidebar belong to the consumer application.</p>
      <p>Resize the window, reorder the Dock tabs, or float either panel.</p>
    </aside>
  </body>
</html>
