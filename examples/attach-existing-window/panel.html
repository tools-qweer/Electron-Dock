<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'"
    >
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Electron Dock consumer panel</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", sans-serif;
        color: #e8efed;
        background: #111514;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 30px;
        background:
          radial-gradient(circle at top right, #173c34 0, transparent 42%),
          #111514;
      }

      main {
        max-width: 640px;
        padding: 28px;
        border: 1px solid #35413f;
        border-radius: 10px;
        background: #171c1b;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 24px;
      }

      p {
        color: #9eaaa8;
      }

      output {
        display: block;
        margin: 20px 0;
        padding: 12px;
        border-radius: 6px;
        color: #00e3bd;
        background: #0c100f;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      button,
      input {
        min-height: 36px;
        border: 1px solid #40504d;
        border-radius: 5px;
        padding: 0 12px;
        color: #e8efed;
        background: #202725;
      }

      button {
        cursor: pointer;
      }

      button:hover {
        border-color: #00e3bd;
      }

      input {
        display: block;
        width: 100%;
        margin-top: 18px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Consumer panel</h1>
      <p>
        This document is owned by the host application. Its state survives
        dock/float reparenting because the same WebContentsView is retained.
      </p>
      <output id="state">Loading panel state…</output>
      <div class="actions">
        <button id="float" type="button">Float panel</button>
        <button id="redock" type="button">Redock panel</button>
        <button id="count" type="button">Counter: 0</button>
      </div>
      <input value="Type here, then float and redock the panel">
    </main>
    <script>
      const parameters = new URLSearchParams(location.search);
      const title = parameters.get("title") ?? "Consumer panel";
      document.title = title;
      document.querySelector("#title").textContent = title;

      const stateOutput = document.querySelector("#state");
      const renderState = (state) => {
        stateOutput.textContent = state === null
          ? "Panel state is unavailable"
          : `host=${state.host} · active=${state.active} · `
            + `visible=${state.visible} · webContents=${state.webContentsId}`;
      };

      void window.electronDock.getPanelState().then(renderState);
      window.electronDock.onPanelStateChanged(renderState);

      document.querySelector("#float").addEventListener("click", async () => {
        renderState(await window.electronDock.floatPanel());
      });
      document.querySelector("#redock").addEventListener("click", async () => {
        renderState(await window.electronDock.redockPanel());
      });

      let count = 0;
      document.querySelector("#count").addEventListener("click", (event) => {
        count += 1;
        event.currentTarget.textContent = `Counter: ${count}`;
      });
    </script>
  </body>
</html>
