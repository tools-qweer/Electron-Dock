name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  github-prerelease:
    name: Verify and publish GitHub prerelease
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.12
          cache: npm

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $version"
          }
          $tagType = git cat-file -t $env:GITHUB_REF_NAME
          if ($tagType -ne "tag") {
            throw "Release tag $env:GITHUB_REF_NAME must be annotated"
          }

      - name: Install dependencies
        run: npm ci

      - name: Run release gates
        run: npm run release:check

      - name: Create release artifact and checksum
        id: artifact
        shell: pwsh
        run: |
          $pack = npm pack --json --ignore-scripts | ConvertFrom-Json
          $asset = $pack[0].filename
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content -LiteralPath "$asset.sha256" -Encoding ascii
          "asset=$asset" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.artifact.outputs.asset }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            $env:ASSET "$env:ASSET.sha256" `
            --verify-tag `
            --prerelease `
            --generate-notes `
            --title "Electron Dock $env:GITHUB_REF_NAME"
