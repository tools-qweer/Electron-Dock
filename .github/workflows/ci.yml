name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    name: Windows x64 package
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.12
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build package and demo
        run: npm run build

      - name: Validate package contract
        run: npm run package:check

      - name: Install and typecheck the packed consumer fixture
        run: npm run package:consumer

      - name: Inspect publish payload
        run: npm pack --dry-run --json --ignore-scripts
